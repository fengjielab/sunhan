<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
  <defs>
    <pattern id="patA" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#8ecae6"/>
      <path d="M0 8 L8 0" stroke="#2b6f8a" stroke-width="1"/>
    </pattern>
    <pattern id="patB" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#ffb703"/>
      <path d="M0 4 H8" stroke="#9a6b00" stroke-width="1"/>
    </pattern>
    <pattern id="patC" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#80c27a"/>
      <path d="M4 0 V8" stroke="#2f6e2c" stroke-width="1"/>
    </pattern>
    <pattern id="patD" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#cdb4db"/>
      <path d="M0 0 L8 8 M8 0 L0 8" stroke="#6d4c7d" stroke-width="1"/>
    </pattern>
    <style>
      .axis { stroke: #111; stroke-width: 2; fill: none; }
      .grid { stroke: #d0d0d0; stroke-width: 1; fill: none; }
      .err { stroke: #111; stroke-width: 1.8; fill: none; }
      .text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimSun", sans-serif; font-size: 18px; fill: #111; }
      .small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimSun", sans-serif; font-size: 15px; fill: #111; }
      .num { font-family: "Times New Roman", serif; font-size: 14px; fill: #111; }
      .tag-bg { fill: #fff; stroke: none; }
      .label { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimSun", sans-serif; font-size: 20px; font-weight: 700; fill: #111; }
      .bar { stroke: #111; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="12" y="12" width="1156" height="696" fill="#fff" stroke="#222" stroke-width="1.5"/>

  <!-- Plot area: x 100-1040, y 80-560; y scale 0-25 s -->
  <line x1="100" y1="560" x2="1040" y2="560" class="axis"/>
  <line x1="100" y1="80" x2="100" y2="560" class="axis"/>

  <!-- Horizontal grid and y labels -->
  <g>
    <line x1="100" y1="560" x2="1040" y2="560" class="grid"/>
    <text x="78" y="566" text-anchor="end" class="num">0</text>
    <line x1="100" y1="464" x2="1040" y2="464" class="grid"/>
    <text x="78" y="470" text-anchor="end" class="num">5</text>
    <line x1="100" y1="368" x2="1040" y2="368" class="grid"/>
    <text x="78" y="374" text-anchor="end" class="num">10</text>
    <line x1="100" y1="272" x2="1040" y2="272" class="grid"/>
    <text x="78" y="278" text-anchor="end" class="num">15</text>
    <line x1="100" y1="176" x2="1040" y2="176" class="grid"/>
    <text x="78" y="182" text-anchor="end" class="num">20</text>
    <line x1="100" y1="80" x2="1040" y2="80" class="grid"/>
    <text x="78" y="86" text-anchor="end" class="num">25</text>
  </g>

  <text x="38" y="320" transform="rotate(-90 38 320)" text-anchor="middle" class="label">完成时间/s</text>

  <!-- soft group -->
  <rect x="150" y="166.8" width="38" height="393.2" fill="url(#patA)" class="bar"/>
  <line x1="169" y1="150.3" x2="169" y2="183.3" class="err"/>
  <line x1="158" y1="150.3" x2="180" y2="150.3" class="err"/>
  <line x1="158" y1="183.3" x2="180" y2="183.3" class="err"/>

  <rect x="198" y="159.3" width="38" height="400.7" fill="url(#patB)" class="bar"/>
  <line x1="217" y1="143.8" x2="217" y2="174.8" class="err"/>
  <line x1="206" y1="143.8" x2="228" y2="143.8" class="err"/>
  <line x1="206" y1="174.8" x2="228" y2="174.8" class="err"/>

  <rect x="246" y="188.5" width="38" height="371.5" fill="url(#patC)" class="bar"/>
  <line x1="265" y1="170.6" x2="265" y2="206.3" class="err"/>
  <line x1="254" y1="170.6" x2="276" y2="170.6" class="err"/>
  <line x1="254" y1="206.3" x2="276" y2="206.3" class="err"/>

  <rect x="294" y="156.6" width="38" height="403.4" fill="url(#patD)" class="bar"/>
  <line x1="313" y1="135.3" x2="313" y2="177.9" class="err"/>
  <line x1="302" y1="135.3" x2="324" y2="135.3" class="err"/>
  <line x1="302" y1="177.9" x2="324" y2="177.9" class="err"/>
  <text x="241" y="595" text-anchor="middle" class="text">soft</text>

  <!-- medium group -->
  <rect x="455" y="132.8" width="38" height="427.2" fill="url(#patA)" class="bar"/>
  <line x1="474" y1="93.1" x2="474" y2="172.6" class="err"/>
  <line x1="463" y1="93.1" x2="485" y2="93.1" class="err"/>
  <line x1="463" y1="172.6" x2="485" y2="172.6" class="err"/>

  <rect x="503" y="159.7" width="38" height="400.3" fill="url(#patB)" class="bar"/>
  <line x1="522" y1="134.2" x2="522" y2="185.3" class="err"/>
  <line x1="511" y1="134.2" x2="533" y2="134.2" class="err"/>
  <line x1="511" y1="185.3" x2="533" y2="185.3" class="err"/>

  <rect x="551" y="190.2" width="38" height="369.8" fill="url(#patC)" class="bar"/>
  <line x1="570" y1="165.2" x2="570" y2="215.1" class="err"/>
  <line x1="559" y1="165.2" x2="581" y2="165.2" class="err"/>
  <line x1="559" y1="215.1" x2="581" y2="215.1" class="err"/>

  <rect x="599" y="163.5" width="38" height="396.5" fill="url(#patD)" class="bar"/>
  <line x1="618" y1="142.9" x2="618" y2="184.0" class="err"/>
  <line x1="607" y1="142.9" x2="629" y2="142.9" class="err"/>
  <line x1="607" y1="184.0" x2="629" y2="184.0" class="err"/>
  <text x="546" y="595" text-anchor="middle" class="text">medium</text>

  <!-- hard group -->
  <rect x="760" y="140.9" width="38" height="419.1" fill="url(#patA)" class="bar"/>
  <line x1="779" y1="126.1" x2="779" y2="155.7" class="err"/>
  <line x1="768" y1="126.1" x2="790" y2="126.1" class="err"/>
  <line x1="768" y1="155.7" x2="790" y2="155.7" class="err"/>

  <rect x="808" y="186.4" width="38" height="373.6" fill="url(#patB)" class="bar"/>
  <line x1="827" y1="163.7" x2="827" y2="209.0" class="err"/>
  <line x1="816" y1="163.7" x2="838" y2="163.7" class="err"/>
  <line x1="816" y1="209.0" x2="838" y2="209.0" class="err"/>

  <rect x="856" y="204.4" width="38" height="355.6" fill="url(#patC)" class="bar"/>
  <line x1="875" y1="173.1" x2="875" y2="235.7" class="err"/>
  <line x1="864" y1="173.1" x2="886" y2="173.1" class="err"/>
  <line x1="864" y1="235.7" x2="886" y2="235.7" class="err"/>

  <rect x="904" y="148.4" width="38" height="411.6" fill="url(#patD)" class="bar"/>
  <line x1="923" y1="119.6" x2="923" y2="177.2" class="err"/>
  <line x1="912" y1="119.6" x2="934" y2="119.6" class="err"/>
  <line x1="912" y1="177.2" x2="934" y2="177.2" class="err"/>
  <text x="851" y="595" text-anchor="middle" class="text">hard</text>

  <!-- Highlight labels for C mode -->
  <rect x="246" y="150" width="38" height="17" class="tag-bg"/>
  <text x="265" y="163" text-anchor="middle" class="num">19.35</text>
  <rect x="551" y="145" width="38" height="17" class="tag-bg"/>
  <text x="570" y="158" text-anchor="middle" class="num">19.26</text>
  <rect x="856" y="153" width="38" height="17" class="tag-bg"/>
  <text x="875" y="166" text-anchor="middle" class="num">18.52</text>

  <!-- Legend -->
  <rect x="210" y="632" width="36" height="20" fill="url(#patA)" class="bar"/>
  <text x="256" y="648" class="small">A 固定参数</text>
  <rect x="405" y="632" width="36" height="20" fill="url(#patB)" class="bar"/>
  <text x="451" y="648" class="small">B 人工选择</text>
  <rect x="600" y="632" width="36" height="20" fill="url(#patC)" class="bar"/>
  <text x="646" y="648" class="small">C 视觉自动</text>
  <rect x="795" y="632" width="36" height="20" fill="url(#patD)" class="bar"/>
  <text x="841" y="648" class="small">D 视觉消融</text>

  <text x="570" y="690" text-anchor="middle" class="small">注：柱高表示平均完成时间，误差线表示标准差；C 视觉自动模式在三类物体上均为最短。</text>
</svg>
