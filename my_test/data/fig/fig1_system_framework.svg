<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#222"/>
    </marker>
    <style>
      .box-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimSun", sans-serif; font-size: 22px; font-weight: 700; fill: #111; }
      .label { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimSun", sans-serif; font-size: 16px; fill: #111; }
      .small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimSun", sans-serif; font-size: 14px; fill: #111; }
      .lane-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimSun", sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; rx: 8; ry: 8; }
      .soft { fill: #e9f5ff; }
      .mid { fill: #eef7e8; }
      .dark { fill: #fff0c7; }
      .lane { fill: #fbfdff; stroke: #888; stroke-width: 1.4; stroke-dasharray: 8 6; rx: 10; ry: 10; }
      .line { stroke: #222; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 5; }
      .thin { stroke: #222; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect x="12" y="12" width="1256" height="736" fill="#fff" stroke="#222" stroke-width="1.5"/>

  <!-- Visual semantic lane -->
  <rect x="48" y="52" width="1184" height="190" class="lane"/>
  <text x="70" y="82" class="lane-title">视觉语义识别与策略选择</text>

  <rect x="92" y="112" width="180" height="82" class="box soft"/>
  <text x="182" y="146" text-anchor="middle" class="box-title">D435i 相机</text>
  <text x="182" y="174" text-anchor="middle" class="label">RGB 图像</text>

  <rect x="342" y="112" width="190" height="82" class="box soft"/>
  <text x="437" y="146" text-anchor="middle" class="box-title">YOLO 检测</text>
  <text x="437" y="174" text-anchor="middle" class="label">目标类别</text>

  <rect x="602" y="112" width="220" height="82" class="box mid"/>
  <text x="712" y="146" text-anchor="middle" class="box-title">语义映射</text>
  <text x="712" y="174" text-anchor="middle" class="label">soft / medium / hard</text>

  <rect x="902" y="96" width="260" height="114" class="box dark"/>
  <text x="1032" y="132" text-anchor="middle" class="box-title">阻抗策略库</text>
  <text x="1032" y="162" text-anchor="middle" class="label">Θ(c)={Kt,Kr,ζ,Kf,d,vg,Fg}</text>
  <text x="1032" y="188" text-anchor="middle" class="label">输出多参数策略</text>

  <path d="M272 153 H342" class="line"/>
  <path d="M532 153 H602" class="line"/>
  <path d="M822 153 H902" class="line"/>

  <!-- Main teleoperation lane -->
  <rect x="48" y="292" width="1184" height="184" class="lane"/>
  <text x="70" y="322" class="lane-title">主从遥操作主流程</text>

  <rect x="82" y="358" width="210" height="82" class="box soft"/>
  <text x="187" y="392" text-anchor="middle" class="box-title">Omega.7 主端</text>
  <text x="187" y="420" text-anchor="middle" class="label">操作者位移输入</text>

  <rect x="380" y="358" width="220" height="82" class="box mid"/>
  <text x="490" y="392" text-anchor="middle" class="box-title">主从运动映射</text>
  <text x="490" y="420" text-anchor="middle" class="label">ΔxΩ → xd</text>

  <rect x="690" y="358" width="220" height="82" class="box mid"/>
  <text x="800" y="392" text-anchor="middle" class="box-title">阻抗控制器</text>
  <text x="800" y="420" text-anchor="middle" class="label">Kt，Kr，ζ</text>

  <rect x="1000" y="342" width="190" height="114" class="box soft"/>
  <text x="1095" y="378" text-anchor="middle" class="box-title">Franka 从端</text>
  <text x="1095" y="408" text-anchor="middle" class="label">Panda 运动</text>
  <text x="1095" y="434" text-anchor="middle" class="label">Hand 抓取</text>

  <path d="M292 399 H380" class="line"/>
  <path d="M600 399 H690" class="line"/>
  <path d="M910 399 H1000" class="line"/>

  <!-- Strategy injection arrows -->
  <path d="M980 210 V270 H800 V358" class="line"/>
  <text x="832" y="282" class="small">阻抗参数</text>

  <path d="M1060 210 V300 H1095 V342" class="line"/>
  <text x="1080" y="282" class="small">夹爪参数</text>

  <!-- Force feedback lane -->
  <rect x="48" y="526" width="1184" height="154" class="lane"/>
  <text x="70" y="556" class="lane-title">力反馈闭环</text>

  <rect x="812" y="586" width="230" height="70" class="box mid"/>
  <text x="927" y="616" text-anchor="middle" class="box-title">力反馈渲染</text>
  <text x="927" y="641" text-anchor="middle" class="label">Kf，d，Fext → Fh</text>

  <path d="M1095 456 V524 H927 V586" class="line dash"/>
  <text x="984" y="516" class="small">外力估计 Fext</text>

  <path d="M812 621 H187 V440" class="line dash"/>
  <text x="438" y="612" class="small">主端力反馈 Fh</text>

  <path d="M1162 153 H1210 V621 H1042" class="line"/>
  <text x="1148" y="520" class="small">Kf，d</text>

  <!-- Notes -->
  <line x1="82" y1="716" x2="210" y2="716" class="thin"/>
  <text x="226" y="721" class="small">实线：运动控制与参数调度；虚线：从端外力到主端力反馈闭环。</text>
</svg>
